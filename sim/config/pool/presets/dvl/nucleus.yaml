# DVL preset "nucleus": a Nortek Nucleus1000 in place of the Water Linked A50 (vehicles/common/nucleus.py). Run BlueOS's
# Nortek extension instead of the Water Linked one (deploy/docker/pool/compose.yaml profile nucleus) and ArduSub's Nortek
# parameters (deploy/docker/ardusub_sitl/params/nucleus.parm). The A50's model stays configured but is off.
dvl:
  enabled: false
nucleus:
  enabled: true
