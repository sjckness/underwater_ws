# The pool's COCO objects (M12 P4): things a stock COCO detector (YOLO yolo26n) knows, that make sense on the floor
# of a pool or floating in it. Placed by pool.objects in sim/config/pool/pool.yaml (or a size preset); the 3-D models are
# fetched and converted by sim/tools/fetch_props.py into assets/props/<id>/<id>.usd (not in git: third-party licences).
#
# Per object:
#   coco      the COCO class name YOLO should report (also the prim's semantic label, for Replicator's boxes)
#   size_m    [length x, width y, height z] of the object as placed, in metres: the model is scaled uniformly so its
#             largest dimension matches the largest of these, and the DVL's beams hit a box (or a sphere) of this size
#             (physics/pool_geometry.py). The fetch step prints the model's real extent: keep the two close
#   shape     box | sphere: the DVL's stand-in solid, and what is drawn while the model is not fetched
#   material  acoustic role (acoustics.materials in pool.yaml)
#   source    url (pinned: an Objaverse revision, or Poly Haven files checked by hash), sha256, include (other files
#             of a glTF: relative path -> url, sha256), licence (SPDX), author, title, page; up: the model's up axis
#             (glTF: Y); rotate_deg: [x, y, z] in the model's own axes, so that its length ends up along +x
#
# Sources chosen 2026-11-27 (Objaverse at allenai/objaverse revision 5566370; Poly Haven API md5 checked): realistic,
# textured, CC0 or CC-BY 4.0, downloadable without an account.
