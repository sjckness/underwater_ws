# Pool hardware profile "workstation": the Work machine (24 GB GPU, Windows native). Same keys as linus.yaml.
profile:
  name: workstation
camera:
  resolution: [1280, 720]
  rate_hz: 30.0
render:
  dlss: true
  refraction_bounces: 1
  reflections: true
stream:
  encoder: libx264
dvl:
  device:
    bind: 127.0.0.1               # the emulated A50 (vehicles/common/a50.py): the DVL extension in WSL reaches it on the
                                  #   mirrored loopback; loopback only, so no Windows firewall prompt for python.exe
physics:
  control:
    bind: [127.0.0.1]             # the WSL containers reach Windows on the mirrored loopback
