# robot_localization for the DVL dead reckoning (docs/dvl.md). Configured, not written: the filter is the
# standard one, and everything specific to this vehicle happens upstream in dvl_dr/preprocess.py.
#
# Inputs, and what each is allowed to touch:
#   imu0    /rov1/mavros/imu/data                  orientation and angular rate, from ArduSub's own EKF3
#   twist0  /rov1/sensors/dvl/velocity_corrected   body linear velocity, lever arm removed
#   pose0   /rov1/nav/depth                        z only, hydrostatic from the baro
# Nothing else. There is NO position measurement in x or y: that is the point. The track is dead
# reckoned, and vehicles/tools/dvl_drift.py measures how fast it walks away from the truth.
#
# The config vectors are robot_localization's 15 flags, in this order:
#   x  y  z   roll pitch yaw   vx vy vz   vroll vpitch vyaw   ax ay az
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5           # longer than the DVL's slowest report would be (2 Hz); the IMU is ~50 Hz
    two_d_mode: false             # a ROV uses all six degrees of freedom
    publish_tf: true              # this node owns odom -> base_link; map -> odom stays a static identity
    print_diagnostics: true

    map_frame: map
    odom_frame: rov1/odom
    base_link_frame: rov1/base_link
    world_frame: rov1/odom        # odometry, not localisation: with no map correction there is nothing to
                                  # anchor map -> odom, and claiming otherwise would be a lie

    imu0: /rov1/mavros/imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true
    # the linear acceleration is deliberately not fused: integrating it is what the DVL is here to avoid,
    # and ArduSub's own bias estimate is already inside the attitude it reports

    twist0: /rov1/sensors/dvl/velocity_corrected
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  true,
                    false, false, false,
                    false, false, false]
    twist0_differential: false
    twist0_relative: false
    twist0_queue_size: 10

    pose0: /rov1/nav/depth
    pose0_config: [false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 10

    # process_noise_covariance is left at robot_localization's default on purpose. It is a flat 15x15
    # (225 values), and inventing one before vehicles/tools/dvl_drift.py has produced a drift number would be
    # tuning against nothing. That tuning is the first thing to do once the chain runs end to end.
