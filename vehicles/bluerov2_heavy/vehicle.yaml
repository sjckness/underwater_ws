# BlueROV2 Heavy (Vectored_6DOF, 8 thrusters): the M8a vehicle, docs/ros_hil.md section 6.3.
#
# Units SI. Every vector is in the ArduPilot body frame FRD (x forward, y starboard, z down), because the
# published Fossen identifications and the ArduPilot JSON link both use it; vehicles/common/frames.py is the only
# place that converts to the repo's tank/ENU and body/FLU frames.
#
# TAGS, one per value, as docs/validation.md and docs/ros_hil.md tag their numbers:
#   V           verified in this session against a file in this repo or an exact datasheet headline figure.
#   UNVERIFIED  a published value quoted from the literature that could NOT be opened in this session (the
#               only network access this session had was the ArduPilot clone). Check against the paper.
#   GUESS       an estimate. Nothing published behind it. These are listed in docs/ros_hil.md M8a.
#
# SOURCES:
#   [BENZON22]  von Benzon, Sorensen, Uth, Jouffroy, Liniger, Pedersen, "An Open-Source Benchmark Simulator:
#               Control of a BlueROV2 Underwater Robot", J. Mar. Sci. Eng. 10(12):1898, 2022,
#               doi:10.3390/jmse10121898 (CC BY 4.0). OPENED 2026-11-25 (M11): every row tagged V [BENZON22]
#               below was checked against its Table A1, which is for the BlueROV2 in HEAVY configuration
#               (section 4.1: "built with eight T200 thrusters"; Table 5: 0.46 x 0.38 x 0.58 m).
#   [AP457]     ArduPilot tag ArduSub-4.5.7 (commit 30257f01): libraries/AP_Motors/AP_Motors6DOF.cpp
#               (SUB_FRAME_VECTORED_6DOF factor table) and libraries/SITL/SIM_Submarine.cpp (Thruster:
#               linear = (forward, lateral, -throttle)), OPENED 2026-11-25. tests/rov/test_motor_map.py pins
#               the table.
#   [WU18]      Wu, "Towards Linear-Parameter-Varying Control of an Underwater Vehicle", MSc thesis, 2018.
#   [T200]      Blue Robotics T200 thruster product page and "T200 Public Performance Data" (10-20 V).
#   [BR2]       Blue Robotics BlueROV2 / BlueROV2 Heavy specifications.
#
# CORRECTION (M11, 2026-11-25): earlier revisions said the identification was for the STANDARD hull. Opening
# [BENZON22] shows Table A1 is the HEAVY: mass and volume measured, inertia and CB from CAD, damping from pool
# tests, added mass from Eidsvik's method on the Heavy's dimensions. So body, added mass and damping below are
# the Heavy's own published set; vehicles/bluerov2/vehicle.yaml (standard hull) is the one that borrows.

model: BlueROV2 Heavy
frame: vectored_6dof            # ArduSub FRAME_CONFIG 2. V: the decision in docs/ros_hil.md 6.3

body:
  # Mass and buoyancy. The BlueROV2 is designed slightly POSITIVELY buoyant so it surfaces on power loss, and
  # the published pair below says +2.0 N: a zero-thrust vehicle rises. M8a step 1 test (a) measures that drift
  # rather than asserting a hover.
  mass_kg: 13.5                 # V [BENZON22] Table A1, "Experimental".
  weight_n: 132.39              # = mass_kg * 9.80665 (a test asserts it to 0.1 %).
  buoyancy_n: 134.39            # = rho g V + trim. rho g V = 1000 * 9.80665 * 0.0134 = 131.41 N (V [BENZON22],
                                #   volume "Experimental", fresh water) would make the vehicle 0.98 N NEGATIVE.
                                #   Blue Robotics ballasts the vehicle slightly positive, so +2.98 N of trim
                                #   (GUESS: foam/ballast) restores the +2.0 N net the earlier revisions carried.
                                #   Given as a FORCE: sim/config/tank.yaml's salinity_psu 35 is not applied.
  volume_m3: 0.0134             # V [BENZON22]; informational only, nothing reads it.
  hull_height_m: 0.254          # V [BR2]: 457 x 575 x 254 mm. Read only by the partial-submersion surface model
                                #   (vehicles.common.dynamics make_vehicle(surface_model=True), the M11 pool).
  hull_size_m: [0.457, 0.575, 0.254]   # V [BR2]: length x width x height, the same 457 x 575 x 254 mm. Read
                                #   only by the pool scene, as the stand-in box when the 3D asset is missing
                                #   (it was a constant in sim/pool_scene.py until the restructure).
  r_g_frd_m: [0.0, 0.0, 0.0]    # V by definition: the body origin IS the centre of gravity, so M_RB is
                                #   diagonal and the weight makes no moment.
  r_b_frd_m: [0.0, 0.0, -0.01]  # V [BENZON22] ("CAD"): centre of buoyancy 1 cm ABOVE the CG (z down, so
                                #   negative). This single number sets the whole roll/pitch restoring stiffness
                                #   (buoyancy_n * 0.01 = 1.344 N m/rad) and hence the righting period.
  inertia_frd_kg_m2: [0.26, 0.23, 0.37]     # V [BENZON22] ("CAD"): Ix, Iy, Iz about the CG.
  inertia_products_kg_m2: [0.0, 0.0, 0.0]   # V [BENZON22]: not given, i.e. taken as zero.

# Added mass, Fossen's notation: M_A = -diag(X_udot ... N_rdot), so these are NEGATIVE.
added_mass:
  X_udot: -6.36                 # V [BENZON22]
  Y_vdot: -7.12                 # V [BENZON22]
  Z_wdot: -18.68                # V [BENZON22]
  K_pdot: -0.189                # V [BENZON22]
  M_qdot: -0.135                # V [BENZON22]
  N_rdot: -0.222                # V [BENZON22]

# Linear damping: D_lin = -diag(...), NEGATIVE coefficients.
# NOTE the three zeros. The published set gives no linear damping in sway, roll or yaw, so free decay in those
# three DOF is purely quadratic: the velocity falls as 1/(1 + k t), not exponentially, and the small-velocity
# tail is long. A real vehicle has some linear damping there. Step 1 test (b) reports a 50 %-decay time for
# every DOF instead of an exponential time constant, for exactly this reason.
damping_linear:
  X_u: -13.7                    # V [BENZON22]
  Y_v: 0.0                      # V [BENZON22] - published as zero
  Z_w: -33.0                    # V [BENZON22]
  K_p: 0.0                      # V [BENZON22] - published as zero
  M_q: -0.8                     # V [BENZON22]
  N_r: 0.0                      # V [BENZON22] - published as zero

# Quadratic damping: D_quad = -diag(...) * |nu|, NEGATIVE coefficients.
damping_quadratic:
  X_uu: -141.0                  # V [BENZON22]. Dominates the surge terminal velocity: with the T200
                                #   maxima below it gives ~0.97 m/s, against [BR2]'s "up to 1.5 m/s". Step 1
                                #   test (c) reports both; this coefficient is the suspect, not the thrust.
  Y_vv: -217.0                  # V [BENZON22]
  Z_ww: -190.0                  # V [BENZON22]
  K_pp: -1.19                   # V [BENZON22]
  M_qq: -0.47                   # V [BENZON22]
  N_rr: -1.50                   # V [BENZON22]

# ----------------------------------------------------------------------------------------- thrusters
#
# Eight T200s. Each entry: the thrust application point in body FRD and the UNIT axis along which POSITIVE
# thrust pushes the body. The 6x8 allocation matrix is built from the geometry - column i is
# [axis_i ; r_i x axis_i] - and never written out by hand, so a geometry edit cannot disagree with it.
#
# CHANNELS AND SIGNS ARE ARDUSUB'S (verified 2026-11-25 against [AP457]; tests/rov/test_motor_map.py pins it).
# Channel c is ArduSub motor c+1 (SERVOn_FUNCTION default: SERVOn = motor n), i.e. JSON pwm[c]. `axis_frd` is
# the direction a POSITIVE output (PWM > 1500) pushes the body, with SITL's convention: SIM_Submarine gives
# each motor linear = (forward, lateral, -climb) of its AP_Motors6DOF factors, so
#   - the four horizontals push along (forward, lateral)/sqrt2 of their factors: the two FRONT motors push
#     backwards for a positive output (forward factor -1), the two rear ones forwards;
#   - the four verticals have climb factor -1, so a positive output pushes DOWN (+z in FRD) and a climb demand
#     drives them below 1500 us.
# Each motor sits on the corner whose roll/pitch/yaw moment has its factor's sign. Earlier revisions had the
# two front horizontals and all four verticals reversed (the [BENZON22] thrust-direction convention, not
# ArduSub's): stick up would have driven the vehicle down. MOTn_DIRECTION must stay 1 in SITL for this to hold.
#
# The 45-deg layout reproduces the published yaw arm 0.1888 m from the +-(0.156, 0.111) mounting points, and
# vehicles/common/dynamics.py asserts the arm comes out at that value. Surge, sway, heave, roll, pitch and yaw each
# have a thrust combination (the factor column of AP_Motors6DOF) that excites nothing else.
thrusters:
  count: 8
  positions_source: >
    V [BENZON22] Table A1 ("CAD"): horizontal at +-(0.156, 0.111) m, vertical at +-(0.120, 0.218) m. The
    horizontal pair reproduces the yaw arm 0.1888 m, the vertical pair the roll arm 0.218 m and pitch arm
    0.120 m.
  list:
    # horizontal, vectored, 45 deg; axis = where a positive output pushes ([AP457] factors, SITL convention)
    - {name: fore_starboard, channel: 0, position_frd_m: [ 0.156,  0.111, 0.0], axis_frd: [-0.70711,  0.70711, 0.0]}
    - {name: fore_port,      channel: 1, position_frd_m: [ 0.156, -0.111, 0.0], axis_frd: [-0.70711, -0.70711, 0.0]}
    - {name: aft_starboard,  channel: 2, position_frd_m: [-0.156,  0.111, 0.0], axis_frd: [ 0.70711,  0.70711, 0.0]}
    - {name: aft_port,       channel: 3, position_frd_m: [-0.156, -0.111, 0.0], axis_frd: [ 0.70711, -0.70711, 0.0]}
    # vertical: a positive output pushes the body DOWN (+z in FRD); climb factor -1
    - {name: vert_fore_starboard, channel: 4, position_frd_m: [ 0.120,  0.218, 0.0], axis_frd: [0.0, 0.0, 1.0]}
    - {name: vert_fore_port,      channel: 5, position_frd_m: [ 0.120, -0.218, 0.0], axis_frd: [0.0, 0.0, 1.0]}
    - {name: vert_aft_starboard,  channel: 6, position_frd_m: [-0.120,  0.218, 0.0], axis_frd: [0.0, 0.0, 1.0]}
    - {name: vert_aft_port,       channel: 7, position_frd_m: [-0.120, -0.218, 0.0], axis_frd: [0.0, 0.0, 1.0]}
  z_offset_note: >
    Every z offset is 0.0, i.e. all eight thrust lines pass through the CG height. [BENZON22] Table A1 puts the
    horizontal four at z = +0.085 m (below the CG, "CAD"). That is NOT adopted: with its own 1 cm CB offset the
    vehicle's maximum righting moment is 1.34 N m, while full surge below the CG would pitch it with 0.085 * 86 N
    = 7.3 N m and tumble it open loop, which a real Heavy in MANUAL does not do. One of the two published numbers
    is off for a ballasted vehicle; measure the CG height (and hence both) before adopting either.

# T200 thrust vs command. The two maxima are the datasheet headline figures at 16 V; the SHAPE between zero
# and full is a power law, which is the GUESS. Replacing it with the published CSV means filling `table` -
# dynamics.py prefers the table whenever it is non-empty.
t200:
  pwm_min_us: 1100              # UNVERIFIED [T200]
  pwm_mid_us: 1500              # UNVERIFIED [T200]
  pwm_max_us: 1900              # UNVERIFIED [T200]
  deadband_us: [1475, 1525]     # UNVERIFIED [T200]: no rotation inside this window
  voltage_v: 16.0               # the voltage the two maxima below belong to
  thrust_fwd_max_n: 51.5        # UNVERIFIED [T200]: 5.25 kgf at 16 V. At 12 V it is 3.55 kgf = 34.8 N.
  thrust_rev_max_n: 40.2        # UNVERIFIED [T200]: 4.10 kgf at 16 V. At 12 V it is 2.79 kgf = 27.4 N.
                                #   The forward/reverse asymmetry is 1.28:1 and is modelled, as asked.
  curve_exponent: 1.4           # GUESS: thrust = max * |u|^1.4 for the normalised command u in [-1, 1].
                                #   Anchored at both ends by construction; the middle is the guess. At u = 0.5
                                #   it gives 0.379 of full thrust, against roughly 0.38 read off the published
                                #   chart - which is why 1.4 and not 2.0 (0.25) or 1.0 (0.5).
  table: []                     # optional [[u, newtons], ...], u in [-1, 1], monotone: overrides curve_exponent
  tau_s: 0.02                   # V [BENZON22] eq. 19: the identified thruster response K(s) = (6136 s + 108700)
                                #   / (s^3 + 89 s^2 + 9258 s + 108700) reaches 63 % of a step at 20 ms (its zero
                                #   at -17.7 nearly cancels the -13.2 pole), so the first-order lag is 0.02 s
                                #   (was 0.1, a GUESS). Eight 2.5 ms steps per time constant: RK4 is far inside
                                #   stability.

integrator:
  rate_hz: 400.0                # V: ArduSub MAIN_LOOP_RATE is 400 Hz (docs/ros_hil.md 3.2, ArduSub/config.h),
                                #   and docs/ros_hil.md 3.2 requires the physics + JSON thread at >= 400 Hz.
                                #   One JSON frame per physics step, so SIM_RATE_HZ equals this.
  method: rk4                   # rk4 | semi_implicit. RK4 at 2.5 ms is 40 steps per thruster time constant
                                #   and ~1400 per righting period: far inside stability for both.

# A SOFT, NON-PHYSICAL bound, because there is no PhysX scene and hence no contacts (docs/ros_hil.md 6.5):
# without it a thrusting vehicle leaves the water, passes through the pipe or exits the tank. The kinematic
# presets got this free from sim.pose.Bounds clipping; a dynamic body does not. Spring-damper per face, applied
# as a pure force at the body origin (no moment - a deliberate simplification, so a vehicle pressed into a wall
# does not acquire a torque the walls could not produce). Every activation is logged and counted.
bound:
  enabled: true                 # default ON for dynamic-ROV runs
  margin_m: 0.2                 # V: the same margin sim.pose.Bounds uses for the kinematic trajectories
  sand_extra_m: 0.1             # V: sim.pose.Bounds adds 0.1 m over the sand on top of the margin
  stiffness_n_per_m: 2000.0     # GUESS: 0.073 m of penetration at full horizontal thrust (145 N); the
                                #   resulting 10.6 rad/s contact mode is ~1400 times slower than the 400 Hz step
  damping_n_s_per_m: 300.0      # GUESS: ~0.8 of critical for the 17.9 kg surge mass, so no bouncing
  surface_stiffness_n_per_m: 4000.0   # GUESS: the free surface is stiffer than the walls, so a buoyant vehicle
                                      #   sits at the surface instead of oscillating through it
  surface_damping_n_s_per_m: 600.0    # GUESS
