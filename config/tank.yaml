# Underwater test tank: 3 x 3 x 3 m container, sand + rocks, gas pipe with a leak, fixed FLS (+ camera).
# World frame: x, y along the tank walls, z up; origin = inner bottom corner of the tank. Units SI.
# Override any value from the command line: --set leak.flow_lpm=30 --set pipe.cover=0.05

seed: 7                         # one seed for everything procedural (sand, rocks, scatterer phases)

tank:
  size: [3.0, 3.0, 3.0]         # inner dimensions [m]
  wall_thickness: 0.05
  wall_material: concrete       # acoustic + visual material of the 4 walls and the floor (materials: below)
  walls:                        # per wall (x0: behind the sonar, x1: the far wall, y0, y1): rms roughness [m] (Rayleigh
                                # loss of the mirror reflection, coherent share of the glints) and an absorbing lining
    x0: {rms_height_m: 0.0005, lining: false}
    x1: {rms_height_m: 0.0005, lining: false}
    y0: {rms_height_m: 0.0005, lining: false}
    y1: {rms_height_m: 0.0005, lining: false}
  water_level: 2.9              # free surface height [m]; 0.1 m freeboard

water:
  temperature_c: 15.0
  salinity_psu: 35.0            # 0 = fresh water
  ambient_depth_m: 0.0          # extra hydrostatic head on top of the tank (0 = real tank at 1 atm).
                                # >0 emulates a deep site for the bubble physics only (gas density, size).
  # light: deep water = no daylight. Per-channel coefficients [R, G, B] in 1/m (clear oceanic, Jerlov IB-II)
  light_attenuation: [0.42, 0.075, 0.055]
  light_scattering: [0.02, 0.025, 0.03]

sand:
  thickness: 0.30               # mean sand surface height above the tank floor [m]
  grid: 0.01                    # render/occlusion mesh spacing [m]
  undulation_amp: 0.02          # low-frequency relief [m]
  undulation_scale: 0.8         # [m]
  ripple_amp: 0.008             # wave ripples, crest-to-mean [m]
  ripple_wavelength: 0.11       # [m]
  ripple_heading_deg: 25.0      # crest normal direction
  material: sand

rocks:
  count: 14
  radius_range: [0.03, 0.16]    # equivalent radius [m]
  flatten: [0.5, 0.85]          # z scale
  embed: [0.2, 0.5]             # fraction of the height sunk into the sand
  keep_out: 0.25                # min distance from the pipe axis and the leak [m]
  material: rock

pipe:
  outer_diameter: 0.168         # 6" pipe
  axis: y                       # runs along y, wall to wall
  x: 1.65                       # axis position across the tank
  length_margin: 0.02           # gap to each wall
  cover: -0.12                  # sand above the pipe crown [m]; <0: crown sticks out by that much
                                # (-0.12: lying on the sand, ~30 % embedded; 0.05: buried under 5 cm)
  material: steel_coated
  flanges_at: [0.55, 2.40]      # bolted flange rings along the pipe [m from the y=0 wall]
  supports: true                # concrete saddle blocks, only where the pipe bottom clears the sand

leak:
  enabled: true
  position_along: 1.45          # [m] along the pipe axis from the y=0 wall
  clock_deg: 45.0               # hole direction around the pipe: 0 = top, +90 = towards +x
  gas: methane                  # methane | air | nitrogen | co2
  source: pressure              # pressure: flow + jet from the pipe pressure and the hole (choked if >~0.85 bar g)
                                # flow: fixed flow_lpm, no jet momentum | flow_jet: flow_lpm, with the jet of the
                                # hole that gives it at pipe_pressure_bar (diameter solved; the leak presets' mode)
  pipe_pressure_bar: 3.0        # gauge pressure inside the pipe
  hole_diameter_mm: 1.0         # 3 bar g through 1 mm -> ~25 L/min methane at the hole ("medium")
  discharge_coeff: 0.62         # sharp-edged hole
  flow_lpm: 25.0                # source flow and flow_jet; at the hole's ambient pressure
  flow_range_lpm: [5.0, 50.0]   # validity range of the leak preset (config/presets/leak): sweeps sample flow_lpm in it
  profile:                      # gas flow over sim time (time 0 = the leak starts; the plume warm-up counts):
    kind: constant              # constant | ramp (0 -> full over ramp_s) | intermittent (on for duty of each period_s)
    ramp_s: 5.0
    period_s: 4.0
    duty: 0.5
    phase: 0.0                  # intermittent: where in its period the leak starts, [0, 1)
  # bubble size after jet breakup: log-normal number distribution
  d50_mm: 3.0                   # number-median volume-equivalent diameter
  sigma_ln: 0.5
  d_range_mm: [0.5, 10.0]
  # buried leak (pipe.cover > 0): gas reaches the sand surface through a few vents
  vents: 3
  vent_spread: 0.6              # vent offset std as a fraction of the cover depth
  vent_switch_s: 2.5            # time scale of the intermittent vent switching
  buried_size_factor: 1.6       # bubbles from sediment vents are larger than jet breakup bubbles
  pockmark_radius: 0.04
  pockmark_depth: 0.015

plume:                          # integral buoyant-jet model (top-hat) for the liquid flow the bubbles ride on
  entrainment_coeff: 0.08       # alpha, Gaussian convention (as papers quote it); 0.05 (jet) .. 0.1 (bubble plume)
  jet_radius0: 0.004            # liquid jet radius where the model starts (after the gas expansion zone) [m]
  turbulence: 0.425             # velocity fluctuation std / local centreline velocity; sets the bubble cloud width.
                                # Calibrated: bubble cloud 0.80-0.84 of the liquid plume width (Milgram 1983: 0.8-0.85)
  meander_amp: 0.3              # centreline wander / local width
  meander_time_s: 3.0
  wobble: true                  # zigzag / helical path oscillation of bubbles > 1.8 mm
  max_bubbles: 150000
  dt: 0.004166667               # bubble integration step [s] (1/240)
  cuda_graph: true              # run each batch of substeps as one captured CUDA graph (same results, less overhead)
  burst_grid_m: 0.01            # cells of the grid that counts where bubbles burst (for the surface boil)
  warmup_s: 12.0                # simulated before the first frame so the plume has reached the surface

lights:                         # artificial light only (deep water)
  ambient_dome: 0.0             # dome intensity; 0 = pitch black outside the lamps
  lamps:                        # LED lamps on the sensor pole: USD sphere lights, intensity = luminance of the emitting
                                # sphere [nits] (luminous intensity = intensity pi radius^2: 4000 cd), shaped to a cone of
                                # cone_deg (full angle) towards target
    - {position: [0.12, 1.30, 1.15], target: [1.7, 1.4, 0.35], intensity: 800000.0, radius: 0.04, cone_deg: 45.0, color: [1.0, 0.97, 0.9]}
    - {position: [0.12, 1.70, 1.15], target: [1.7, 1.6, 0.35], intensity: 800000.0, radius: 0.04, cone_deg: 45.0, color: [1.0, 0.97, 0.9]}

materials:
  # acoustic: Z = acoustic impedance [MRayl] (reflection at normal incidence from it, or `reflection` if given);
  #           lambert_db = Lambert parameter mu [dB];
  #           rough on the wavelength scale (sand, rock): rms_slope = facet slope std of the incoherent Kirchhoff term;
  #           coherent (smooth: pipe, walls): rms_height_m and correlation_m of a Gaussian surface; the mirror-like
  #           part (Rayleigh factor exp(-k^2 h^2 (cos_i + cos_s)^2 / 2)) is a Kirchhoff integral over triangles with
  #           deterministic phase, the rest is incoherent with rms_slope = sqrt(2) h / correlation (all assumed)
  # visual:   base colour, roughness, metallic
  sand:         {Z: 3.2,  lambert_db: -27.0, rms_slope: 0.25, color: [0.62, 0.55, 0.42], roughness: 0.95, metallic: 0.0}
  rock:         {Z: 5.5,  lambert_db: -17.0, rms_slope: 0.35, color: [0.36, 0.34, 0.31], roughness: 0.9,  metallic: 0.0}
  concrete:     {Z: 8.0,  lambert_db: -32.0, coherent: true, rms_height_m: 0.0005, correlation_m: 0.01,
                 color: [0.55, 0.55, 0.53], roughness: 0.85, metallic: 0.0}       # bare, moderately rough
  steel_coated: {Z: 30.0, lambert_db: -35.0, coherent: true, rms_height_m: 0.00005, correlation_m: 0.005,
                 color: [0.18, 0.2, 0.22], roughness: 0.5, metallic: 0.3}
  glass:        {Z: 13.0, lambert_db: -40.0, coherent: true, rms_height_m: 0.00001, correlation_m: 0.005,
                 color: [0.7, 0.8, 0.8], roughness: 0.05, metallic: 0.0}
  lining:       {Z: 1.9, reflection: 0.1, lambert_db: -40.0, coherent: true, rms_height_m: 0.0005, correlation_m: 0.01,
                 color: [0.12, 0.12, 0.13], roughness: 0.9, metallic: 0.0}       # absorbing tank lining (rubber tiles)

sonar:
  model: Oculus M750d           # Blueprint Subsea. VERIFIED: on the datasheet (Blueprint Subsea, "Oculus M Series
                                # Datasheet EN"); UNVERIFIED: assumed, not on the datasheet
  mode: lf                      # lf | hf (modes below)
  position: [0.10, 1.50, 1.05]  # acoustic centre, on a pole at the -x wall
  roll_deg: 0.0                 # about the look axis: 90 turns the fan vertical (the array then measures elevation)
  pitch_deg: 15.0               # positive = nose down
  yaw_deg: 0.0                  # 0 looks along +x
  range: 3.5                    # range setting [m], at most the mode's max_range
  ping_rate_hz: 10.0            # at most the mode's max_ping_rate_hz
  trajectory:                   # pose_source trajectory (the profile; uw/pose.py). Time 0 = end of the plume warm-up
    preset: approach            # approach | lawnmower | orbit | hover | waypoints | poses
    speed: 0.15                 # [m/s] along the path
    height: 1.0                 # [m] above the tank floor (approach, orbit, lawnmower)
    pitch: track                # track: the axis points at the leak | a fixed pitch [deg, nose down]
    roll_deg: 0.0
    margin: 0.2                 # [m] from the walls, the sand (+0.1) and the surface
    start_distance: 1.5         # approach: horizontal distance to the leak at the start and the end [m] (the start
    end_distance: 0.6           #   is pulled in to stay inside the tank)
    bearing_deg: 180.0          # approach: direction from the leak to the start (180: from the -x wall)
    radius: 1.0                 # orbit: radius [m], start angle [deg] around the leak, sweep [deg], direction (+1 ccw)
    start_deg: 180.0
    sweep_deg: 360.0
    direction: 1
    lanes: 4                    # lawnmower: lanes along x, spread across y; pitch when pitch is track (nothing to
    survey_pitch_deg: 30.0      #   track on a survey)
    drift_m: 0.02               # hover at sonar.position (looking at the leak with pitch track): Ornstein-Uhlenbeck
    drift_yaw_deg: 2.0          #   drift std of the position [m] and the yaw [deg], correlation time [s]
    drift_time_s: 3.0
    waypoints: []               # preset waypoints: [{position: [x, y, z], roll_deg, pitch_deg, yaw_deg, speed}, ...]
    loop: false
    poses: []                   # preset poses: [{position: [x, y, z], roll_deg, pitch_deg, yaw_deg}, ...], each held
    hold_s: 3.0                 #   for hold_s, then the next (several fixed views of one scene; static_cache on_motion)
  static_cache_motion: {position_m: 0.005, angle_deg: 0.25}   # static_cache on_motion: recompute beyond these
  ros_pose_topic: /uw/sonar_pose  # pose_source ros: geometry_msgs/PoseStamped of the sonar in the tank frame
  modes:                        # VERIFIED (datasheet): frequency, fan (h x v), beams, angular resolution (-3 dB beam
                                # width), range resolution, min range, max range, max update rate
    lf: {frequency_hz: 750000.0, fov_h_deg: 130.0, fov_v_deg: 20.0, beams: 512, beamwidth_h_deg: 1.0,
         range_resolution: 0.004, min_range: 0.1, max_range: 120.0, max_ping_rate_hz: 40.0}
    hf: {frequency_hz: 1200000.0, fov_h_deg: 70.0, fov_v_deg: 12.0, beams: 512, beamwidth_h_deg: 0.6,
         range_resolution: 0.0025, min_range: 0.1, max_range: 40.0, max_ping_rate_hz: 40.0}
  beam_spacing: uniform_angle   # uniform_angle | uniform_sine (UNVERIFIED: not on the datasheet)
  focus: true                   # dynamic near-field focusing of the receive array (UNVERIFIED: not on the datasheet; ask Blueprint)
  array_taper_sll_db: -28.0     # Taylor taper sidelobe level of the receive array (UNVERIFIED: not on the datasheet)
  taylor_nbar: 4
  fan_edge_db: -3.0             # two-way horizontal gain at the fan edges (UNVERIFIED: not on the datasheet)
  vertical_edge_db: -3.0        # two-way vertical gain at +-fov_v/2 (UNVERIFIED: not on the datasheet)
  vertical_taper: hann          # vertical TX/RX aperture: hann | cosine | uniform (sinc) (UNVERIFIED: not on the datasheet)
  source_level_db: 206.0        # dB re 1 uPa @ 1 m (assumed; only sets the SNR together with noise_level_db)
  noise_level_db: 52.0          # receiver noise spectrum level per element, dB re 1 uPa^2/Hz, over the band c/(2 dr)
                                # and reduced by the array gain in the beams (assumed)
  receiver_noise_common_db: null   # receiver noise common to every element, dB re the per-element noise; null: off.
                                # It sums up in the broadside beam (a focusing array spreads it at near range): a
                                # stripe at bearing 0. An Oculus M1200d shows one, +3.4 to +10 dB over its far-half
                                # background (docs/validation.md, M3.6); its level on the M750d is UNVERIFIED
  tvg_db_per_decade: 30.0       # TVG: k log10(R) + 2 alpha R (30: area scattering)
  display_db: [0.0, 80.0]       # dB window above the beam noise floor mapped to 0..255 (a display gain, not physics)
  ringdown_db: 60.0             # transducer ring-down at zero range, dB above the beam noise floor (UNVERIFIED: not on the datasheet)
  ringdown_m: 0.08              # ring-down e-folding length (UNVERIFIED: not on the datasheet)
  volume_sv_db: -75.0           # volume backscattering strength of the tank water [dB re 1/m] (assumed)
  surface_roughness_m: 0.0002   # rms height of the calm water surface (assumed)
  boil_roughness_m: 0.005       # rms height where the plume breaks the surface (assumed)
  boil_backscatter:             # the boil's own echo (uw/surface.py): Kirchhoff (geometric optics) of a rough
    enabled: true               # pressure-release surface, rms slope per axis, over the area the bursts disturb:
    rms_slope: 0.3              #   share 1 - exp(-rate / saturation_rate) of each cell, rate = bursts per s and m^2
    saturation_rate: 20000.0    #   (smoothed over time_s); random phase every ping (assumed values)
    time_s: 0.3
  multipath: [surface, walls]   # specular image paths: surface (pressure release), walls (Z of the wall material)
  bubble_paths: bistatic        # bistatic: bubbles' image paths over every multipath boundary, with the gas sphere's
                                # bistatic cross-section (modal series) on the paths in and out by different routes |
                                # surface_backscatter: surface paths only, backscatter cross-section on all (M2)
  receiver_noise: true          # switches for tests
  reverberation: true
  ringdown: true
  speckle_sigma_rad: 0.1        # speckle dynamics: std of each cell's slow phase walk (assumed); 0 = frozen speckle
  speckle_time_s: 2.0           # its correlation time (assumed)
  extinction_voxel: 0.02        # bubble extinction grid [m]
  coherent_patch_m: 0.015       # max triangle edge of the coherent (Kirchhoff) facets: keeps the phase linear across one
  plume_path_floor_db: -60.0    # scene paths through the plume region weaker than the beam noise floor + this [dB]
                                # skip the per-ping extinction (they join the static image unattenuated); null: none
  u_grid: 2048                  # direction-cosine cells of the FFT beamformer (aperture sampled at half a wavelength)
  plume_mask_threshold: 0.5     # dataset label: a pixel is plume when the bubbles carry more than this share of its energy
  scatterer_spacing: 0.002      # surface sampling [m] for the acoustic scatterers (fixed in the world: frozen speckle);
                                # the base: scatterer_spacing_mode adaptive (profile) coarsens it far from the sonar

recorder:                       # python -m uw sonar-only datasets
  fan_png: false                # also write the Cartesian fan image per ping (derivable from the polar one)
  compress: true                # npz: zlib (savez_compressed) | false: savez, bigger but much faster to write.
                                # Writing is on the sweep worker's critical path: false is the speed lever there.
  png_level: 3                  # zlib level of the label/display PNGs (0: store, fastest)

sim:                            # python -m uw sim: the Isaac app
  realtime: true                # pace sim time to the wall clock (--no-realtime: as fast as it goes); the watchdog
                                # reports pings over sonar.ping_budget_ms and sim time falling behind
  max_lag_s: 0.5                # watchdog: warn when sim time is this far behind the wall clock
  gui_fps: 20.0                 # GUI viewport refresh in sim time; headless renders only for the camera
  bubbles_rendered: true        # bubble PointInstancer in the RTX scene (camera, GUI)
  bubble_stride: 1              # render every n-th bubble slot (1: all)
  bubble_render_hz: 10.0        # instancer updates (each makes RTX rebuild the instances: ~20 ms for 60 k bubbles)
  bubble_mesh_level: 1          # bubble prototype: icosphere subdivision level (1: 80 triangles); -1: implicit sphere
  bubble_material: glass        # glass: gas-in-water dielectric (IOR 0.75) | inspect: opaque light blue, for looking at
                                # the plume in the GUI (the camera images then show it too)
  max_refraction_bounces: 2     # RTX refraction depth through the bubbles (each bubble is two interfaces)
  overlay_fan: true             # GUI only (omni.ui.scene: over the viewport, never in the camera images): the
                                # wireframe of the sonar's field of view
  overlay_returns: true         #   and the current sonar image as points on the fan's centre plane
  overlay_returns_min: 170      #   pixels (0-255) from this value up are drawn (at most 6000 points)
  view: side45                  # GUI viewport camera at start: side45 | top | sonar
  viewport_resolution: [1280, 720]   # GUI viewport render size (not the window's: a maximised window costs GPU time)

ros:                            # SensorSink "ros" (uw/ros_bridge.py); the domain is UW_ROS_DOMAIN_ID (default 73)
  clock_hz: 60.0                # /clock (sim time)
  plume_hz: 2.0                 # /sim/plume
  plume_markers: 3000           # at most this many bubbles in /sim/plume (evenly decimated)
  leak_hz: 1.0                  # /sim/leak, /sim/leak/flow_lpm
  fan_width: 1024               # /oculus/fan (and recorder fan PNG) width [px]

camera:
  enabled: true
  position: [0.10, 1.50, 0.95]  # just below the sonar
  rpy_deg: [0.0, 18.0, 0.0]
  resolution: [1280, 720]
  hfov_deg: 80.0                # in-water field of view (flat port)
  rate_hz: 10.0
