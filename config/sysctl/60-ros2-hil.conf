# ROS 2 HIL over Ethernet (docs/bridge_setup.md §4): UDP socket and IP reassembly limits for large samples.
# Install on every host that carries sim traffic — linus, thor, orin:
#     sudo install -m 644 config/sysctl/60-ros2-hil.conf /etc/sysctl.d/60-ros2-hil.conf && sudo sysctl --system
#
# Why these and not more. One sonar ping is ~448 kB at tank/lf and the camera frame is 2.76 MB, so at MTU 1500
# a single sample is 300 to 1900 IP fragments and one lost fragment drops the whole sample. net.core.rmem_max
# bounds what Fast DDS may ask for with SO_RCVBUF, and the profile in §4 asks for 4 MB; measured on linus
# 2026-10-29 the limit was already 4194304 but set by nothing on disk, so a reboot would have silently halved
# the headroom. ipfrag_high_thresh is the reassembly buffer the fragments land in.
#
# rmem_default is deliberately left at the kernel's 212992: the DDS profile sets its own socket sizes, so
# raising the default for every socket on the machine buys nothing and costs memory in the f1tenth stacks that
# share this host.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.ipfrag_high_thresh = 16777216
