[pytest]
# host:  pytest              pure Python/numpy; Warp tests are skipped
# GPU:   scripts/uw.sh test  the same tests in the Isaac container, Warp tests included
testpaths = tests
pythonpath = .
# A sourced ROS 2 brings the launch_testing plugin, which imports every test module during collection: the GPU
# tests' importorskip then skips the whole tests/ directory on the host. There are no launch tests here
# (launch_ros extends launch_testing, so it goes too).
addopts = -p no:launch_testing -p no:launch_ros
